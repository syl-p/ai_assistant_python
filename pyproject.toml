[project]
name = "ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sylvain", email = "sylvain.pastor@top-webgroup.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "pyaudio>=0.2.14",
    "pyttsx3>=2.99",
    "speechrecognition[vosk]>=3.17.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
